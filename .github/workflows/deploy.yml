name: Verify production builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  NEXT_TELEMETRY_DISABLED: '1'
  STRAPI_TELEMETRY_DISABLED: 'true'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

  strapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

  gallery-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: build_only
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: dmc_build_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build_only -d dmc_build_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend/gallery-api
    env:
      # Disposable runner service only; never a repository or production secret.
      DATABASE_URL: postgresql://build_only:isolated-test-only@127.0.0.1:5432/dmc_build_test
      GALLERY_SECURITY_DB_TEST: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/gallery-api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx --no-install prisma migrate deploy --config prisma7.config.ts
      - run: npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --config prisma7.config.ts --exit-code
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical
